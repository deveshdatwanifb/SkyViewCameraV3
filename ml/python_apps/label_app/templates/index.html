<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FyveBy Annotator (YOLO Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        #canvasContainer canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #131314; }
        ::-webkit-scrollbar-thumb { background: #333538; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444746; }
    </style>
</head>
<body class="bg-[#131314] text-[#e3e3e3] min-h-screen flex flex-col font-sans antialiased">

    <header class="bg-[#1e1e24] p-4 border-b border-[#444746] flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-4">
            <img src="static/logo.svg" alt="FyveBy Logo" class="h-8 w-auto object-contain min-w-[130px]">
            <h1 class="text-base font-medium tracking-wide text-[#e3e3e3]">FyveBy Annotator</h1>
        </div>
        <div class="flex items-center gap-2">
            <div class="text-xs text-[#a8c7fa] font-mono bg-[#131314] px-3 py-1.5 rounded-lg border border-[#444746] hidden" id="imageCounterDisplay">Image 0 of 0</div>
            <div class="text-xs text-[#c4c7c5] font-mono bg-[#131314] px-3 py-1.5 rounded-lg border border-[#444746]" id="folderDisplay">No folder selected</div>
        </div>
    </header>

    <div class="flex flex-col flex-grow overflow-hidden">
        
        <div class="h-[58vh] flex w-full border-b border-[#444746] overflow-hidden">
            <aside class="w-64 bg-[#1e1e24] border-r border-[#444746] p-3 flex flex-col overflow-hidden">
                <div class="flex flex-col gap-2 mb-3 pb-2 border-b border-[#444746]">
                    <h3 class="text-[11px] font-medium uppercase tracking-widest text-[#c4c7c5]">Workspace Storage</h3>
                    <button onclick="selectFolder()" class="w-full bg-[#0b57d0] hover:bg-[#1b66c9] text-white font-medium py-2 rounded-lg text-xs shadow-sm transition-all duration-200 cursor-pointer">
                        📂 Select Local Folder
                    </button>
                </div>
                <div id="thumbnailContainer" class="flex-grow overflow-y-auto pr-1 flex flex-col gap-1.5"></div>
            </aside>

            <main class="flex-grow bg-[#0e0e10] p-4 flex flex-col items-center justify-center relative overflow-hidden">
                <div id="canvasContainer" class="border border-[#444746] rounded-xl bg-[#131314] shadow-sm flex items-center justify-center overflow-hidden p-1 w-full h-full max-h-[54vh]">
                    <canvas id="annotationCanvas" class="cursor-crosshair"></canvas>
                </div>
                <div class="absolute bottom-3 text-[11px] tracking-wide text-[#c4c7c5] bg-[#1e1e24]/90 px-4 py-1.5 rounded-full border border-[#444746] backdrop-blur shadow-sm select-none">
                    Hotkeys: <span class="bg-[#333538] px-1 rounded text-white font-mono font-bold">B</span> Box • <span class="bg-[#333538] px-1 rounded text-white font-mono font-bold">K</span> Keypoint • <span class="bg-[#333538] px-1 rounded text-white font-mono font-bold">E</span> Edit • <span class="bg-[#333538] px-1 rounded text-white font-mono font-bold">1-7</span> Keypoints Selection || Scroll to Zoom • Right-Click + Drag to Move • <span class="bg-[#333538] px-1 rounded text-white font-mono font-bold">Delete</span> Clear Item
                </div>
            </main>
        </div>

        <div class="h-[32vh] flex bg-[#131314] p-4 gap-4 overflow-hidden w-full">
            
            <section class="flex-grow bg-[#1e1e24] border border-[#444746] rounded-xl p-4 flex flex-col justify-between overflow-y-auto">
                <div class="grid grid-cols-4 gap-4">
                    
                    <div class="flex flex-col gap-2">
                        <label class="text-[11px] font-medium uppercase tracking-widest text-[#c4c7c5]">Drawing Mode</label>
                        <div class="grid grid-cols-4 gap-1 mt-1">
                            <button id="toolBox" onclick="setMode('box')" class="bg-[#0b57d0] border border-transparent text-white py-2 rounded-lg font-medium text-[10px] tracking-wide shadow-sm transition-all duration-150 cursor-pointer">▢ Box</button>
                            <button id="toolPoint" onclick="setMode('point')" class="bg-[#131314] border border-[#444746] text-[#c4c7c5] py-2 rounded-lg font-medium text-[10px] tracking-wide hover:bg-[#202124] transition-all duration-150 cursor-pointer">☉ Point</button>
                            <button id="toolEdit" onclick="setMode('edit')" class="bg-[#131314] border border-[#444746] text-[#c4c7c5] py-2 rounded-lg font-medium text-[10px] tracking-wide hover:bg-[#202124] transition-all duration-150 cursor-pointer">⌖ Edit</button>
                            <button id="toolCrop" onclick="setMode('crop')" class="bg-[#131314] border border-orange-500/30 text-orange-400 py-2 rounded-lg font-medium text-[10px] tracking-wide hover:bg-[#202124] transition-all duration-150 cursor-pointer">✂️ Crop</button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-[11px] font-medium uppercase tracking-widest text-[#c4c7c5]">Asset Management Actions</label>
                        <div class="grid grid-cols-3 gap-1 mt-1">
                            <button id="executeCropBtn" disabled onclick="executeImgCrop()" class="bg-[#131314] border border-[#444746] text-[#888888] py-2 rounded-lg font-medium text-[11px] cursor-not-allowed transition">Cut Crop</button>
                            <button id="resizeBtn" disabled onclick="executeImgResize()" class="bg-[#131314] border border-[#444746] text-[#888888] py-2 rounded-lg font-medium text-[11px] cursor-not-allowed transition">📐 Resize</button>
                            <button id="deleteBtn" disabled onclick="executeImgDelete()" class="bg-[#131314] border border-[#444746] text-[#888888] py-2 rounded-lg font-medium text-[11px] cursor-not-allowed transition">🗑️ Delete</button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-1.5 transition-all duration-200" id="boxConfigArea">
                        <label class="text-[11px] font-medium uppercase tracking-widest text-[#c4c7c5]">Box Instance Category</label>
                        <input type="text" id="objectLabel" value="airplane" class="w-full bg-[#131314] border border-[#444746] rounded-lg px-3 py-2 text-xs text-[#e3e3e3] focus:outline-none focus:border-[#a8c7fa] transition-colors mt-1 disabled:cursor-not-allowed disabled:bg-[#18181b]">
                    </div>

                    <div class="flex flex-col gap-1.5 transition-all duration-200" id="keypointConfigArea">
                        <label class="text-[11px] font-medium uppercase tracking-widest text-[#c4c7c5]">Aircraft Keypoint & COCO Visibility</label>
                        <select id="keypointTypeSelect" class="w-full bg-[#131314] border border-[#444746] rounded-lg px-3 py-2 text-xs text-[#e3e3e3] focus:outline-none focus:border-[#a8c7fa] transition-colors mt-1 disabled:cursor-not-allowed disabled:bg-[#18181b]">
                            <option value="nose">Nose</option>
                            <option value="left_wing_tip">Left Wing Tip</option>
                            <option value="right_wing_tip">Right Wing Tip</option>
                            <option value="tail_top_corner">Tail Top Corner</option>
                            <option value="left_landing_gear">Left Landing Gear</option>
                            <option value="right_landing_gear">Right Landing Gear</option>
                            <option value="nose_gear">Nose Gear</option>
                        </select>

                        <div id="visibilitySubBlock" class="flex items-center justify-between mt-2 bg-[#131314] p-1.5 rounded-lg border border-[#444746]">
                            <span class="text-[10px] font-medium uppercase text-[#c4c7c5]">COCO Vis:</span>
                            <label class="inline-flex items-center text-[11px] gap-0.5 text-[#4af2a1] cursor-pointer">
                                <input type="radio" name="kpVisGroup" value="2" checked class="accent-[#0b57d0]"> 2 (Visible)
                            </label>
                            <label class="inline-flex items-center text-[11px] gap-0.5 text-[#eab308] cursor-pointer">
                                <input type="radio" name="kpVisGroup" value="1" class="accent-[#0b57d0]"> 1 (Occluded)
                            </label>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between border-t border-[#444746] pt-3 mt-2">
                    <div class="flex items-center gap-2">
                        <div class="flex items-center gap-3 bg-[#131314] px-3 py-1.5 rounded-lg border border-[#444746]">
                            <input type="text" id="s3UriInput" placeholder="s3://your-bucket-name/optional-prefix" class="bg-transparent text-xs text-[#e3e3e3] focus:outline-none w-64">
                            <button id="s3SyncButton" onclick="triggerS3CloudSync()" class="text-[#74a0fa] hover:text-[#a8c7fa] font-semibold text-xs tracking-wide ml-2 transition cursor-pointer">
                                ☁️ Sync Cloud
                            </button>
                        </div>
                        <div class="flex flex-col gap-0.5 pl-2">
                            <label class="text-[11px] font-medium uppercase tracking-widest text-[#c4c7c5]">Image Meta Tags <span class="text-red-400 font-bold">*</span></label>
                            <input type="text" id="imageTags" placeholder="e.g. LAX, clear, arrival" class="bg-[#131314] border border-[#444746] rounded-lg px-3 py-1 text-xs text-[#e3e3e3] focus:outline-none focus:border-[#a8c7fa] transition-colors w-48">
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="bg-[#131314] px-3 py-2 rounded-lg border border-[#444746] text-xs font-mono text-[#c4c7c5]">
                            Saved: <span id="annotationDate" class="text-[#e3e3e3]">Not annotated yet</span>
                        </div>
                        <button onclick="resetViewport()" class="bg-[#131314] hover:bg-[#202124] border border-[#444746] text-[#e3e3e3] px-4 py-2 rounded-lg font-medium text-xs tracking-wide transition cursor-pointer">Reset View</button>
                        <button onclick="clearCurrentAnnotations()" class="bg-[#131314] hover:bg-[#202124] border border-[#444746] text-[#c4c7c5] px-4 py-2 rounded-lg font-medium text-xs tracking-wide transition cursor-pointer">Clear Canvas</button>
                        <button onclick="saveAnnotationPayload()" class="bg-[#0b57d0] hover:bg-[#1b66c9] text-white font-medium px-6 py-2 rounded-lg text-xs tracking-wide shadow-sm transition cursor-pointer">Save Data</button>
                    </div>
                </div>
            </section>

            <section class="w-80 bg-[#1e1e24] border border-[#444746] rounded-xl p-3 flex flex-col overflow-hidden">
                <h3 class="text-[11px] font-medium uppercase tracking-widest text-[#c4c7c5] mb-2 border-b border-[#444746] pb-1">Live YOLO Labels (.txt)</h3>
                <pre id="jsonPreview" class="flex-grow overflow-y-auto font-mono text-[10px] text-[#a8c7fa] bg-[#131314] p-2.5 rounded-lg border border-[#444746] leading-tight"></pre>
            </section>

        </div>
    </div>

    <script>
        let currentMode = 'box'; 
        let isDrawing = false;
        let isPanning = false;
        let startX, startY;
        let latestImgX, latestImgY;
        let startPanX, startPanY;
        
        let currentWorkspace = null;
        let selectedFile = null;
        let localStore = {}; 
        let allImages = [];

        let scale = 1.0;
        let panX = 0;
        let panY = 0;

        let bboxes = [];
        let keypoints = [];
        let selectedItem = null;
        let editAction = 'none';
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        let manualCropBox = null;
        let currentMouseCanvasX = null;
        let currentMouseCanvasY = null;

        const COCO_KP_ORDER = [
            "nose", "left_wing_tip", "right_wing_tip", "tail_top_corner",
            "left_landing_gear", "right_landing_gear", "nose_gear"
        ];

        const canvas = document.getElementById('annotationCanvas');
        const ctx = canvas.getContext('2d');
        const imgInstance = new Image();

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        document.getElementById('objectLabel').addEventListener('input', (e) => {
            if (selectedItem && currentMode === 'edit' && selectedItem.x1 !== undefined) {
                selectedItem.label = e.target.value;
                renderCanvas();
            }
        });

        document.getElementById('keypointTypeSelect').addEventListener('change', (e) => {
            if (selectedItem && currentMode === 'edit' && selectedItem.visibility !== undefined) {
                selectedItem.label = e.target.value;
                renderCanvas();
            }
        });

        document.querySelectorAll('input[name="kpVisGroup"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (selectedItem && currentMode === 'edit' && selectedItem.visibility !== undefined) {
                    selectedItem.visibility = parseInt(e.target.value);
                    renderCanvas();
                }
            });
        });

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;
            
            const key = e.key.toLowerCase();
            
            if (key === 'b') {
                e.preventDefault();
                setMode('box');
            } else if (key === 'k') {
                e.preventDefault();
                setMode('point');
            } else if (key === 'e') {
                e.preventDefault();
                setMode('edit');
            } else if (['1', '2', '3', '4', '5', '6', '7'].includes(key)) {
                e.preventDefault();
                const kpSelect = document.getElementById('keypointTypeSelect');
                const kpIdx = parseInt(key) - 1;
                if (kpIdx >= 0 && kpIdx < COCO_KP_ORDER.length) {
                    kpSelect.value = COCO_KP_ORDER[kpIdx];
                    if (currentMode === 'edit' && selectedItem && selectedItem.visibility !== undefined) {
                        selectedItem.label = COCO_KP_ORDER[kpIdx];
                    } else {
                        setMode('point');
                    }
                    renderCanvas();
                }
            } else if (key === 'delete' || key === 'backspace') {
                if (currentMode === 'edit' && selectedItem) {
                    e.preventDefault();
                    if (selectedItem.x1 !== undefined) {
                        bboxes = bboxes.filter(box => box !== selectedItem);
                    } else {
                        keypoints = keypoints.filter(pt => pt !== selectedItem);
                    }
                    selectedItem = null;
                    editAction = 'none';
                    setMode('edit'); 
                    renderCanvas();
                }
            }
        });

        document.getElementById('imageTags').addEventListener('input', () => {
            updateJsonPreview();
        });

        function setMode(mode) {
            currentMode = mode;
            if (mode !== 'edit') { selectedItem = null; editAction = 'none'; }
            if (mode !== 'crop') { manualCropBox = null; }
            
            const activeClass = "bg-[#0b57d0] border border-transparent text-white py-2 rounded-lg font-medium text-xs tracking-wide shadow-sm transition-all duration-150";
            const inactiveClass = "bg-[#131314] border border-[#444746] text-[#c4c7c5] py-2 rounded-lg font-medium text-xs tracking-wide hover:bg-[#202124] transition-all duration-150";
            const inactiveCropClass = "bg-[#131314] border border-orange-500/30 text-orange-400 py-2 rounded-lg font-medium text-xs tracking-wide hover:bg-[#202124] transition-all duration-150";
            const activeCropClass = "bg-orange-600 border border-transparent text-white py-2 rounded-lg font-medium text-xs tracking-wide shadow-sm transition-all duration-150";

            document.getElementById('toolBox').className = mode === 'box' ? activeClass : inactiveClass;
            document.getElementById('toolPoint').className = mode === 'point' ? activeClass : inactiveClass;
            document.getElementById('toolEdit').className = mode === 'edit' ? activeClass : inactiveClass;
            document.getElementById('toolCrop').className = mode === 'crop' ? activeCropClass : inactiveCropClass;

            const boxArea = document.getElementById('boxConfigArea');
            const kpArea = document.getElementById('keypointConfigArea');
            const boxInput = document.getElementById('objectLabel');
            const kpSelect = document.getElementById('keypointTypeSelect');
            const visRadios = document.querySelectorAll('input[name="kpVisGroup"]');

            boxInput.disabled = true; kpSelect.disabled = true; visRadios.forEach(r => r.disabled = true);
            boxArea.style.opacity = "0.4"; kpArea.style.opacity = "0.4";

            if (mode === 'box') {
                boxArea.style.opacity = "1"; boxInput.disabled = false;
            } else if (mode === 'point') {
                kpArea.style.opacity = "1"; kpSelect.disabled = false; visRadios.forEach(r => r.disabled = false);
            } else if (mode === 'edit') {
                if (selectedItem) {
                    if (selectedItem.x1 !== undefined) {
                        boxArea.style.opacity = "1"; boxInput.disabled = false;
                        boxInput.value = selectedItem.label;
                    } else {
                        kpArea.style.opacity = "1"; kpSelect.disabled = false; visRadios.forEach(r => r.disabled = false);
                        kpSelect.value = selectedItem.label;
                        const targetRadio = document.querySelector(`input[name="kpVisGroup"][value="${selectedItem.visibility || 2}"]`);
                        if (targetRadio) targetRadio.checked = true;
                    }
                }
            }
            toggleCropButtonState();
            renderCanvas();
        }

        function toggleCropButtonState() {
            const executeCropBtn = document.getElementById('executeCropBtn');
            if (currentMode === 'crop' && manualCropBox) {
                executeCropBtn.disabled = false;
                executeCropBtn.className = "bg-orange-600 hover:bg-orange-700 text-white py-2 rounded-lg font-medium text-[11px] cursor-pointer transition shadow-sm";
            } else {
                executeCropBtn.disabled = true;
                executeCropBtn.className = "bg-[#131314] border border-[#444746] text-[#888888] py-2 rounded-lg font-medium text-[11px] cursor-not-allowed transition";
            }
        }

        function toggleAssetActionButtons(enable) {
            const resizeBtn = document.getElementById('resizeBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            const disabledStyle = "bg-[#131314] border border-[#444746] text-[#888888] py-2 rounded-lg font-medium text-[11px] cursor-not-allowed transition";

            if (enable) {
                resizeBtn.disabled = false; resizeBtn.className = "bg-[#131314] border border-[#444746] text-[#c4c7c5] hover:bg-[#202124] hover:text-white py-2 rounded-lg font-medium text-[11px] cursor-pointer transition";
                deleteBtn.disabled = false; deleteBtn.className = "bg-[#131314] border border-red-900/40 text-red-400 hover:bg-red-950/40 py-2 rounded-lg font-medium text-[11px] cursor-pointer transition";
            } else {
                resizeBtn.disabled = true; resizeBtn.className = disabledStyle;
                deleteBtn.disabled = true; deleteBtn.className = disabledStyle;
            }
        }

        async function selectFolder() {
            const res = await fetch('/select_folder', { method: 'POST' });
            const data = await res.json();
            if(data.status === 'cancelled') return;

            currentWorkspace = data.folder;
            document.getElementById('folderDisplay').innerText = data.folder;
            localStore = data.annotations;
            rebuildWorkspaceGallery(data.images);
        }

        function rebuildWorkspaceGallery(imagesArray) {
            allImages = imagesArray;
            const thumbBox = document.getElementById('thumbnailContainer');
            thumbBox.innerHTML = '';

            imagesArray.forEach(img => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-1.5 rounded-lg bg-[#131314] hover:bg-[#202124] cursor-pointer transition border border-transparent";
                div.id = `thumb-${img}`;
                div.onclick = () => focusImage(img);

                const thumb = document.createElement('img');
                thumb.src = `/image/${img}?workspace=${encodeURIComponent(currentWorkspace)}&t=${new Date().getTime()}`;
                thumb.className = "w-10 h-10 object-cover rounded-lg shadow-inner bg-[#0e0e10]";

                const label = document.createElement('span');
                label.className = "text-[11px] truncate w-32 font-mono text-[#c4c7c5]";
                label.innerText = img;

                div.appendChild(thumb);
                div.appendChild(label);
                thumbBox.appendChild(div);
            });

            if(imagesArray.length > 0) {
                toggleAssetActionButtons(true);
                if (!selectedFile || !imagesArray.includes(selectedFile)) {
                    focusImage(imagesArray[0]);
                } else {
                    focusImage(selectedFile);
                }
            } else {
                selectedFile = null; toggleAssetActionButtons(false);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                document.getElementById('jsonPreview').textContent = '';
                document.getElementById('imageCounterDisplay').classList.add('hidden');
            }
        }

        function focusImage(filename) {
            if(selectedFile) { document.getElementById(`thumb-${selectedFile}`)?.classList.remove('border-[#0b57d0]', 'bg-[#202124]'); }
            selectedFile = filename; selectedItem = null; editAction = 'none'; manualCropBox = null;
            document.getElementById(`thumb-${filename}`)?.classList.add('border-[#0b57d0]', 'bg-[#202124]');

            imgInstance.src = `/image/${filename}?workspace=${encodeURIComponent(currentWorkspace)}&t=${new Date().getTime()}`;
            imgInstance.onload = () => {
                resetViewport();
                
                if (allImages.length > 0) {
                    let currentIndex = allImages.indexOf(filename) + 1;
                    let counterBadge = document.getElementById('imageCounterDisplay');
                    counterBadge.classList.remove('hidden');
                    counterBadge.innerText = `Image ${currentIndex} of ${allImages.length}`;
                }

                const record = localStore[filename] || { bboxes: [], keypoints: [], tags: [], date: "Not annotated yet" };
                bboxes = record.bboxes || [];
                keypoints = record.keypoints || [];
                document.getElementById('imageTags').value = (record.tags || []).join(', ');
                document.getElementById('annotationDate').innerText = record.date || "Not annotated yet";
                setMode(currentMode);
            };
        }

        function resetViewport() {
            if (!selectedFile || !imgInstance.naturalWidth) return;
            const container = document.getElementById('canvasContainer');
            const targetWidth = container.clientWidth - 8;
            const targetHeight = container.clientHeight - 8;
            
            canvas.width = targetWidth; canvas.height = targetHeight;
            scale = Math.min(targetWidth / imgInstance.naturalWidth, targetHeight / imgInstance.naturalHeight) * 0.95;
            panX = (targetWidth - imgInstance.naturalWidth * scale) / 2;
            panY = (targetHeight - imgInstance.naturalHeight * scale) / 2;
            renderCanvas();
        }

        async function executeImgCrop() {
            if (!manualCropBox || !selectedFile) return;
            const rawTags = document.getElementById('imageTags').value;
            const cleanTags = rawTags.split(',').map(t => t.trim()).filter(t => t.length > 0);

            const response = await fetch('/transform_image', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    workspace: currentWorkspace,
                    filename: selectedFile, action: 'crop', 
                    coords: [manualCropBox.x1, manualCropBox.y1, manualCropBox.x2, manualCropBox.y2], 
                    bboxes: bboxes, keypoints: keypoints, tags: cleanTags 
                })
            });
            const data = await response.json();

            if (response.ok && data.status === 'success') {
                bboxes = data.bboxes;
                keypoints = data.keypoints;
                manualCropBox = null;
                localStore[selectedFile] = { bboxes, keypoints, tags: cleanTags, date: data.date };
                focusImage(selectedFile);
            } else {
                alert("❌ Crop Error Notification:\n\n" + (data.message || "Rejected."));
            }
        }

        async function executeImgResize() {
            if (!selectedFile) return;
            const targetWidth = prompt("Enter target pixel width:", imgInstance.naturalWidth);
            if (!targetWidth || isNaN(targetWidth)) return;
            const rawTags = document.getElementById('imageTags').value;
            const cleanTags = rawTags.split(',').map(t => t.trim()).filter(t => t.length > 0);

            const response = await fetch('/transform_image', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ workspace: currentWorkspace, filename: selectedFile, action: 'resize', width: parseInt(targetWidth), bboxes: bboxes, keypoints: keypoints, tags: cleanTags })
            });
            const data = await response.json();

            if (response.ok && data.status === 'success') {
                bboxes = data.bboxes;
                keypoints = data.keypoints;
                selectedItem = null;
                localStore[selectedFile] = { bboxes, keypoints, tags: cleanTags, date: data.date };
                focusImage(selectedFile);
            } else {
                alert("❌ Resize Error Notification:\n\n" + data.message);
            }
        }

        async function executeImgDelete() {
            if (!selectedFile) return;
            if (!confirm(`⚠️ Permanently wipe local tracking files for '${selectedFile}'?`)) return;

            const oldFilename = selectedFile;
            const currentIndex = allImages.indexOf(oldFilename);
            let nextSelectedFile = null;
            
            if (allImages.length > 1) {
                if (currentIndex === allImages.length - 1) {
                    nextSelectedFile = allImages[currentIndex - 1];
                } else {
                    nextSelectedFile = allImages[currentIndex + 1];
                }
            }

            const response = await fetch('/delete_image', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ workspace: currentWorkspace, filename: oldFilename })
            });

            if (response.ok) {
                delete localStore[oldFilename];
                const updatedImages = allImages.filter(img => img !== oldFilename);
                selectedFile = nextSelectedFile; 
                rebuildWorkspaceGallery(updatedImages);
            } else {
                alert("❌ Error processing the deletion request.");
            }
        }

        function buildYoloLines() {
            // One YOLO pose line per box: `cls cx cy w h px1 py1 v1 ... px7 py7 v7`
            // (box + keypoint coords normalized to image dimensions).
            const w = imgInstance.naturalWidth || 1, h = imgInstance.naturalHeight || 1;
            const lines = [];

            bboxes.forEach(box => {
                const x1 = Math.min(box.x1, box.x2), x2 = Math.max(box.x1, box.x2);
                const y1 = Math.min(box.y1, box.y2), y2 = Math.max(box.y1, box.y2);
                const parts = [
                    '0',
                    ((x1 + x2) / 2 / w).toFixed(6),
                    ((y1 + y2) / 2 / h).toFixed(6),
                    ((x2 - x1) / w).toFixed(6),
                    ((y2 - y1) / h).toFixed(6),
                ];

                const slots = Array.from({ length: COCO_KP_ORDER.length }, () => ['0.000000', '0.000000', '0']);
                keypoints.forEach(kp => {
                    if (kp.x >= x1 && kp.x <= x2 && kp.y >= y1 && kp.y <= y2) {
                        const idx = COCO_KP_ORDER.indexOf(kp.label);
                        if (idx !== -1) slots[idx] = [(kp.x / w).toFixed(6), (kp.y / h).toFixed(6), String(kp.visibility)];
                    }
                });
                slots.forEach(s => parts.push(...s));
                lines.push(parts.join(' '));
            });

            return lines.join('\n');
        }

        function updateJsonPreview() {
            if (!selectedFile) return;
            document.getElementById('jsonPreview').textContent = buildYoloLines() || '# no labels yet';
        }

        function renderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(panX, panY); ctx.scale(scale, scale);
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(imgInstance, 0, 0);

            bboxes.forEach(box => {
                const isSelected = (box === selectedItem);
                ctx.strokeStyle = isSelected ? '#ff8da1' : '#74a0fa';
                ctx.lineWidth = (isSelected ? 4.0 : 2.5) / scale;
                ctx.strokeRect(box.x1, box.y1, box.x2 - box.x1, box.y2 - box.y1);
                
                ctx.fillStyle = isSelected ? '#ff8da1' : '#74a0fa';
                ctx.font = `bold ${16 / scale}px sans-serif`;
                ctx.fillText(box.label, box.x1, box.y1 - (6 / scale));

                if (isSelected && currentMode === 'edit') {
                    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ff8da1'; ctx.lineWidth = 1.5 / scale;
                    let sz = 10 / scale;
                    ctx.fillRect(box.x1 - sz/2, box.y1 - sz/2, sz, sz); ctx.strokeRect(box.x1 - sz/2, box.y1 - sz/2, sz, sz);
                    ctx.fillRect(box.x2 - sz/2, box.y1 - sz/2, sz, sz); ctx.strokeRect(box.x2 - sz/2, box.y1 - sz/2, sz, sz);
                    ctx.fillRect(box.x1 - sz/2, box.y2 - sz/2, sz, sz); ctx.strokeRect(box.x1 - sz/2, box.y2 - sz/2, sz, sz);
                    ctx.fillRect(box.x2 - sz/2, box.y2 - sz/2, sz, sz); ctx.strokeRect(box.x2 - sz/2, box.y2 - sz/2, sz, sz);
                }
            });

            keypoints.forEach(pt => {
                const isSelected = (pt === selectedItem);
                ctx.strokeStyle = isSelected ? '#ff8da1' : (pt.visibility === 2 ? '#4af2a1' : '#eab308');
                ctx.lineWidth = (isSelected ? 4.5 : 3.2) / scale;
                let rad = (isSelected ? 11.0 : 8.0) / scale;

                ctx.beginPath();
                ctx.moveTo(pt.x - rad, pt.y - rad); ctx.lineTo(pt.x + rad, pt.y + rad);
                ctx.moveTo(pt.x - rad, pt.y + rad); ctx.lineTo(pt.x + rad, pt.y - rad);
                ctx.stroke();

                ctx.fillStyle = isSelected ? '#ff8da1' : '#ffffff';
                ctx.font = `bold ${16 / scale}px sans-serif`;
                ctx.fillText(`${pt.label.replace(/_/g, ' ')} (v:${pt.visibility})`, pt.x + rad + (6 / scale), pt.y + (5 / scale));
            });

            if (isDrawing && currentMode === 'box') {
                ctx.strokeStyle = '#eab308'; ctx.lineWidth = 2.5 / scale;
                ctx.strokeRect(startX, startY, latestImgX - startX, latestImgY - startY);
            }

            if (currentMode === 'crop' && manualCropBox) {
                ctx.strokeStyle = '#f97316'; ctx.lineWidth = 3.0 / scale;
                ctx.setLineDash([6 / scale, 4 / scale]);
                ctx.strokeRect(manualCropBox.x1, manualCropBox.y1, manualCropBox.x2 - manualCropBox.x1, manualCropBox.y2 - manualCropBox.y1);
                ctx.setLineDash([]);
            } else if (isDrawing && currentMode === 'crop') {
                ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2.5 / scale;
                ctx.setLineDash([6 / scale, 4 / scale]);
                ctx.strokeRect(startX, startY, latestImgX - startX, latestImgY - startY);
                ctx.setLineDash([]);
            }

            ctx.restore();

            if (currentMouseCanvasX !== null && currentMouseCanvasY !== null && ['box', 'point', 'crop'].includes(currentMode)) {
                ctx.save();
                ctx.strokeStyle = 'rgba(124, 254, 12, 1.0)'; 
                ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(0, currentMouseCanvasY); ctx.lineTo(canvas.width, currentMouseCanvasY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(currentMouseCanvasX, 0); ctx.lineTo(currentMouseCanvasX, canvas.height); ctx.stroke();
                ctx.restore();
            }
            updateJsonPreview();
        }

        function fetchRelativeCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const canvasX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const canvasY = (e.clientY - rect.top) * (canvas.height / rect.height);
            return {
                imgX: (canvasX - panX) / scale, imgY: (canvasY - panY) / scale,
                canvasX: canvasX, canvasY: canvasY
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if(!selectedFile) return;
            const coords = fetchRelativeCoords(e);

            if (e.button === 2) { 
                isPanning = true; startPanX = e.clientX - panX; startPanY = e.clientY - panY; return;
            }

            if (e.button === 0) { 
                if (currentMode === 'edit') {
                    if (selectedItem && selectedItem.x1 !== undefined) {
                        let sz = Math.max(12, 14 / scale);
                        if (Math.abs(coords.imgX - selectedItem.x1) < sz && Math.abs(coords.imgY - selectedItem.y1) < sz) { editAction = 'resize-tl'; return; }
                        if (Math.abs(coords.imgX - selectedItem.x2) < sz && Math.abs(coords.imgY - selectedItem.y1) < sz) { editAction = 'resize-tr'; return; }
                        if (Math.abs(coords.imgX - selectedItem.x1) < sz && Math.abs(coords.imgY - selectedItem.y2) < sz) { editAction = 'resize-bl'; return; }
                        if (Math.abs(coords.imgX - selectedItem.x2) < sz && Math.abs(coords.imgY - selectedItem.y2) < sz) { editAction = 'resize-br'; return; }
                        
                        if (coords.imgX >= selectedItem.x1 && coords.imgX <= selectedItem.x2 && coords.imgY >= selectedItem.y1 && coords.imgY <= selectedItem.y2) {
                            editAction = 'move-box'; dragOffsetX = coords.imgX - selectedItem.x1; dragOffsetY = coords.imgY - selectedItem.y1; return;
                        }
                    }

                    let found = null;
                    for (let i = keypoints.length - 1; i >= 0; i--) {
                        let pt = keypoints[i];
                        if (Math.sqrt(Math.pow(pt.x - coords.imgX, 2) + Math.pow(pt.y - coords.imgY, 2)) < 18 / scale) { found = pt; editAction = 'move-point'; break; }
                    }
                    if (!found) {
                        for (let i = bboxes.length - 1; i >= 0; i--) {
                            let box = bboxes[i];
                            if (coords.imgX >= box.x1 && coords.imgX <= box.x2 && coords.imgY >= box.y1 && coords.imgY <= box.y2) {
                                found = box; editAction = 'move-box'; dragOffsetX = coords.imgX - box.x1; dragOffsetY = coords.imgY - box.y1; break;
                            }
                        }
                    }
                    selectedItem = found; setMode('edit'); return;
                }

                startX = Math.max(0, Math.min(imgInstance.naturalWidth, coords.imgX));
                startY = Math.max(0, Math.min(imgInstance.naturalHeight, coords.imgY));

                if(currentMode === 'point') {
                    const kpType = document.getElementById('keypointTypeSelect').value;
                    const kpVisibility = parseInt(document.querySelector('input[name="kpVisGroup"]:checked').value);
                    keypoints.push({ x: startX, y: startY, label: kpType, visibility: kpVisibility });
                    renderCanvas();
                } else if (currentMode === 'box' || currentMode === 'crop') {
                    isDrawing = true; latestImgX = startX; latestImgY = startY;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const coords = fetchRelativeCoords(e);
            currentMouseCanvasX = coords.canvasX; currentMouseCanvasY = coords.canvasY;

            if (isPanning) {
                panX = e.clientX - startPanX; panY = e.clientY - startPanY; renderCanvas(); return;
            }
            
            if (currentMode === 'edit' && selectedItem && editAction !== 'none') {
                if (editAction === 'move-box') {
                    let w = selectedItem.x2 - selectedItem.x1, h = selectedItem.y2 - selectedItem.y1;
                    let nx1 = Math.max(0, Math.min(imgInstance.naturalWidth - w, coords.imgX - dragOffsetX));
                    let ny1 = Math.max(0, Math.min(imgInstance.naturalHeight - h, coords.imgY - dragOffsetY));
                    selectedItem.x1 = nx1; selectedItem.y1 = ny1; selectedItem.x2 = nx1 + w; selectedItem.y2 = ny1 + h;
                } else if (editAction === 'move-point') {
                    selectedItem.x = Math.max(0, Math.min(imgInstance.naturalWidth, coords.imgX));
                    selectedItem.y = Math.max(0, Math.min(imgInstance.naturalHeight, coords.imgY));
                } else if (editAction === 'resize-tl') {
                    selectedItem.x1 = Math.max(0, Math.min(selectedItem.x2 - 5, coords.imgX));
                    selectedItem.y1 = Math.max(0, Math.min(selectedItem.y2 - 5, coords.imgY));
                } else if (editAction === 'resize-tr') {
                    selectedItem.x2 = Math.max(selectedItem.x1 + 5, Math.min(imgInstance.naturalWidth, coords.imgX));
                    selectedItem.y1 = Math.max(0, Math.min(selectedItem.y2 - 5, coords.imgY));
                } else if (editAction === 'resize-bl') {
                    selectedItem.x1 = Math.max(0, Math.min(selectedItem.x2 - 5, coords.imgX));
                    selectedItem.y2 = Math.max(selectedItem.y1 + 5, Math.min(imgInstance.naturalHeight, coords.imgY));
                } else if (editAction === 'resize-br') {
                    selectedItem.x2 = Math.max(selectedItem.x1 + 5, Math.min(imgInstance.naturalWidth, coords.imgX));
                    selectedItem.y2 = Math.max(selectedItem.y1 + 5, Math.min(imgInstance.naturalHeight, coords.imgY));
                }
                renderCanvas(); return;
            }

            if (isDrawing) {
                latestImgX = Math.max(0, Math.min(imgInstance.naturalWidth, coords.imgX));
                latestImgY = Math.max(0, Math.min(imgInstance.naturalHeight, coords.imgY));
            }
            renderCanvas();
        });

        canvas.addEventListener('mouseleave', () => {
            currentMouseCanvasX = null; currentMouseCanvasY = null; renderCanvas();
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 2) { isPanning = false; return; }
            if (currentMode === 'edit') { editAction = 'none'; renderCanvas(); return; }
            if(!isDrawing) return;
            isDrawing = false;

            const x1 = Math.min(startX, latestImgX), y1 = Math.min(startY, latestImgY);
            const x2 = Math.max(startX, latestImgX), y2 = Math.max(startY, latestImgY);

            if(Math.abs(x2 - x1) > 3 && Math.abs(y2 - y1) > 3) {
                if (currentMode === 'box') {
                    bboxes.push({ x1, y1, x2, y2, label: document.getElementById('objectLabel').value || 'airplane' });
                } else if (currentMode === 'crop') {
                    manualCropBox = { x1, y1, x2, y2 }; toggleCropButtonState();
                }
            }
            renderCanvas();
        });

        canvas.addEventListener('wheel', (e) => {
            if (!selectedFile) return; e.preventDefault();
            const coords = fetchRelativeCoords(e);
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            const newScale = Math.min(Math.max(0.1, scale * zoomFactor), 100); 

            panX = coords.canvasX - (coords.canvasX - panX) * (newScale / scale);
            panY = coords.canvasY - (coords.canvasY - panY) * (newScale / scale);
            scale = newScale; renderCanvas();
        }, { passive: false });

        async function saveAnnotationPayload() {
            if(!selectedFile) return;
            const rawTags = document.getElementById('imageTags').value;
            const cleanTags = rawTags.split(',').map(t => t.trim()).filter(t => t.length > 0);

            if (!cleanTags.some(tag => /^[A-Za-z]{3,4}$/.test(tag))) {
                alert("⚠️ Validation Error: You must include at least one valid 3 or 4-letter airport code (e.g. LAX, KLAX) in your tags.");
                return;
            }
            const processedTags = cleanTags.map(tag => /^[A-Za-z]{3,4}$/.test(tag) ? tag.toUpperCase() : tag);

            const payload = { 
                workspace: currentWorkspace,
                filename: selectedFile, 
                bboxes, 
                keypoints, 
                tags: processedTags,
                image_width: imgInstance.naturalWidth,
                image_height: imgInstance.naturalHeight
            };
            
            const response = await fetch('/save', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            const data = await response.json();
            
            if(response.ok && data.status === 'success') {
                localStore[selectedFile] = { bboxes, keypoints, tags: processedTags, date: data.date };
                document.getElementById('annotationDate').innerText = data.date;
                document.getElementById('imageTags').value = processedTags.join(', ');
                renderCanvas();
                alert('✅ Saved to YOLO label file!');
            } else {
                alert("❌ Critical Error Saving File:\n\n" + data.message);
            }
        }

        async function triggerS3CloudSync(confirmDelete = false) {
            const s3Uri = document.getElementById('s3UriInput').value.trim();
            const syncButton = document.getElementById('s3SyncButton');

            if (!s3Uri) {
                alert("⚠️ Error: Enter an S3 URI (e.g. s3://your-bucket/optional-prefix) to sync.");
                return;
            }

            syncButton.disabled = true;
            syncButton.innerText = "Syncing...";

            try {
                const response = await fetch('/sync_s3', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ s3_uri: s3Uri, confirm_delete: confirmDelete })
                });
                const data = await response.json();

                if (!response.ok) {
                    alert(`❌ S3 Sync Failure:\n\n${data.message || 'The server encountered an error.'}`);
                    return;
                }

                if (data.status === 'pulled') {
                    // First-time pull: adopt the freshly downloaded folder as the workspace.
                    currentWorkspace = data.folder;
                    document.getElementById('folderDisplay').innerText = data.folder;
                    localStore = data.annotations || {};
                    rebuildWorkspaceGallery(data.images || []);
                    alert(`✅ Pulled from cloud!\n\n${data.message}`);
                } else if (data.status === 'confirm_delete') {
                    // Dangerous step: show the file-count warning and only delete on explicit OK.
                    if (window.confirm(`⚠️ ${data.message}`)) {
                        await triggerS3CloudSync(true);
                    } else {
                        alert("Sync finished — uploads applied, nothing deleted from S3.");
                    }
                } else if (data.status === 'success') {
                    alert(`✅ Cloud Sync Success!\n\n${data.message}`);
                } else {
                    alert(`❌ S3 Sync Failure:\n\n${data.message || 'Unknown error.'}`);
                }
            } catch (err) {
                alert(`❌ Network Connection Error: Could not reach the annotation backend controller server.`);
            } finally {
                syncButton.disabled = false;
                syncButton.innerText = "☁️ Sync Cloud";
            }
        }

        window.addEventListener('resize', () => { if (selectedFile) resetViewport(); });
    </script>
</body>
</html>
